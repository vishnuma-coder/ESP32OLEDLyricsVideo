[platformio]
# CHANGE default_envs to esp32s3 when using the ESP32-S3 environment below.
default_envs = esp32dev

# Classic ESP32 DevKit: default OLED wiring is SDA=21, SCL=22.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SSD1306

; One firmware upload contains the video frames; no filesystem upload is used.

# ESP32-S3 DevKitC-1: this environment sets OLED pins to SDA=8, SCL=9.
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_flags =
    -D OLED_SDA=8
    -D OLED_SCL=9
lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SSD1306
